services:
  - type: web
    name: esl-booking-api
    runtime: node
    region: singapore
    branch: main
    rootDir: esl-booking-system/backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: esl_booking
      - key: DB_SSL
        value: "true"
      # Hours (PHT) the in-process keep-alive may self-ping. Outside this window
      # the free instance is allowed to idle-sleep, which is what keeps monthly
      # usage under Render's 750 instance-hour quota. "0-23" restores always-on;
      # "off" disables self-pinging entirely. See backend/scheduler.js.
      - key: KEEPALIVE_HOURS
        value: "6-22"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
